name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run desktop:typecheck
      - run: npm test
      - run: npm run desktop:bundle
      - name: Windows app smoke test
        shell: pwsh
        run: |
          $env:AKIRA_DESKTOP_SMOKE = '1'
          npx electron . --disable-gpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Continue'
          npm run desktop:dist:win 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $message = (Get-Content build-log.txt -Tail 45) -join ' | '
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$message"
            exit $code
          }
      - name: Packaged application smoke test
        shell: pwsh
        run: |
          $env:AKIRA_DESKTOP_SMOKE = '1'
          $process = Start-Process -FilePath "desktop/release/win-unpacked/Akira Discord Export.exe" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Packaged application timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged application failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Akira-Windows-Setup
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
