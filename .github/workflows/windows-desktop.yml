name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run desktop:typecheck
      - run: npm test
      - run: npm run desktop:bundle
      - name: Windows app smoke test
        shell: pwsh
        run: |
          $env:AKIRA_DESKTOP_SMOKE = '1'
          npx electron . --disable-gpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run desktop:dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Akira-Windows-Setup
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
